[package]
name = "immich-edit-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "immich-edit"
path = "src/main.rs"

[features]
default = ["ml"]
ml = ["dep:ml"]

[dependencies]
raw-pipeline = { path = "../raw-pipeline" }
ml = { path = "../ml", optional = true }
anyhow = "1"
axum = "0.8"
tokio = { workspace = true }
futures-util = { version = "0.3", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "timeout", "limit", "fs", "set-header", "request-id", "util", "catch-panic"] }
reqwest = { version = "0.13", features = ["json", "query", "stream", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
http = "1"
lru = "0.18"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.11"
hex = "0.4"
aes-gcm = "0.11"
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
base64 = "0.23"
zip = { version = "8", default-features = false }
mimalloc = { version = "0.1", default-features = false }
lensfun = "=0.7.0"
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
reqwest = { version = "0.13", features = ["json", "query"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
url = { workspace = true }
tempfile = "3"
