[package]
name = "raw-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
native = [
    "dep:rawler",
    "dep:turbojpeg",
    "dep:jpegxl-rs",
    "dep:jpegxl-sys",
    "dep:libheif-rs",
    "dep:webp",
    "dep:png",
    "dep:tiff",
    "dep:image",
    "dep:little_exif",
    "dep:flate2",
    "dep:pollster",
    "dep:zstd",
    "wgpu/dx12",
    "wgpu/metal",
    "wgpu/vulkan",
    "wgpu/gles",
]
web = ["wgpu/webgpu", "wgpu/fragile-send-sync-non-atomic-wasm", "dep:futures-channel"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.11"
hex = "0.4"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
lru = "0.18"
half = "2.7.1"
fast_image_resize = "6.0.0"
rayon = { workspace = true }
multiversion = "0.9"
web-time = "1"
ruzstd = "0.8"
zstd = { version = "0.13", optional = true }
rawler = { version = "0.8", optional = true }
turbojpeg = { version = "1", default-features = false, features = ["pkg-config"], optional = true }
pollster = { version = "1.0", optional = true }
little_exif = { version = "0.6", optional = true }
png = { version = "0.18", optional = true }
tiff = { version = "0.11", optional = true }
webp = { version = "0.3", optional = true }
flate2 = { version = "1", optional = true }
jpegxl-rs = { version = "0.15", features = ["vendored"], optional = true }
jpegxl-sys = { version = "0.13", optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "bmp"], optional = true }
libheif-rs = { version = "2.7", default-features = false, features = ["v1_19"], optional = true }
futures-channel = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
turbojpeg = { version = "1", default-features = false, features = ["cmake"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cpu_pipeline"
harness = false
test = false
