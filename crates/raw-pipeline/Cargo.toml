[package]
name = "raw-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
rawler = "0.7"
turbojpeg = "1"
sha2 = "0.11"
hex = "0.4"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0"
parking_lot = "0.12"
lru = "0.18"
half = "2.7.1"
fast_image_resize = "6.0.0"
rayon = { workspace = true }
little_exif = "0.6"
png = "0.18"
tiff = "0.11"
webp = "0.3"
rgb = "0.8"
flate2 = "1"
jpegxl-rs = { version = "0.14", features = ["vendored"] }
jpegxl-sys = "0.12"
image = { version = "0.25", default-features = false, features = ["gif", "bmp"] }
libheif-rs = { version = "2.7", default-features = false, features = ["v1_19"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cpu_pipeline"
harness = false
