services:
  immich-edit:
    image: haavardnk/immich-edit:latest
    # For local development, replace the image line above with:
    # image: immich-edit:local
    # build: .
    ports:
      - "3000:3000"
    volumes:
      - edit-data:/data
    restart: unless-stopped

    # --- AI inference (optional overrides) ---
    # environment:
    #   ML_RUNTIME: auto
    #   ML_MAX_EDGE: 2048
    #   ML_MAX_CONCURRENCY: 1
    #   ML_IDLE_SECS: 60

    # --- AMD or Intel GPU (uncomment) ---
    # Replace 105 with the group ID that owns the render node on the host:
    #   stat -c '%g' /dev/dri/renderD128
    # Use the number, not a name like "render"; names are looked up inside
    # the container, where they do not match the host.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"

    # --- NVIDIA GPU (uncomment, needs NVIDIA Container Toolkit) ---
    # "graphics" adds the Vulkan driver; the toolkit's default leaves it out.
    # Merge this with the environment block above if you use both.
    # environment:
    #   NVIDIA_DRIVER_CAPABILITIES: graphics,utility
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  edit-data:
