<!doctype html>
<html lang="en" class="dark" data-theme-revision="%theme.revision%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="immich-edit" />
    <title>immich-edit</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem('immich-ui-theme');
          var mode = stored === null ? 'dark' : JSON.parse(stored);
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          var cache = JSON.parse(localStorage.getItem('immich-edit:theme') || 'null');
          if (!cache || cache.version !== 1) return;
          if (cache.revision !== root.getAttribute('data-theme-revision')) return;
          var style = document.createElement('style');
          style.id = 'immich-edit-theme';
          style.textContent = cache.css;
          document.head.appendChild(style);
          root.setAttribute('data-theme', '');
          var chrome = cache.chrome[dark ? 'dark' : 'light'];
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', chrome.themeColor);
          document.querySelector('link[rel="icon"]').setAttribute('href', chrome.favicon);
        } catch (error) {
          return;
        }
      })();
    </script>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%sveltekit.assets%/fonts/google-sans-core.woff2"
      crossorigin="anonymous"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
