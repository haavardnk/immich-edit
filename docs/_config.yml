title: immich-edit
description: Documentation for the self-hosted RAW editor for Immich
url: https://haavardnk.github.io
baseurl: /immich-edit
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

color_scheme: dark
favicon_ico: /assets/images/favicon.svg
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub:
    - https://github.com/haavardnk/immich-edit
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/haavardnk/immich-edit
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue