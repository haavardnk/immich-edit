name: Deployment problem
description: immich-edit won't start, can't reach Immich, or doesn't use the GPU.
labels: [deployment]
body:
  - type: textarea
    id: symptom
    attributes:
      label: What is failing?
      description: The exact error, and your host and GPU, for example Unraid 7 with an Intel iGPU.
    validations:
      required: true
  - type: textarea
    id: compose
    attributes:
      label: compose.yaml
      description: Remove secrets first.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs immich-edit` from startup to the failure."
      render: shell
    validations:
      required: true
  - type: textarea
    id: support_bundle
    attributes:
      label: Support bundle
      description: If immich-edit opens, copy it from **Settings & diagnostics** > **Diagnostics** > **Copy support bundle**.
