name: Bug report
description: Something in immich-edit is broken.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you do, what went wrong, and what did you expect? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a RAW file
        2. Change exposure
        3. Save
    validations:
      required: true
  - type: textarea
    id: support_bundle
    attributes:
      label: Support bundle
      description: Open **Settings & diagnostics** > **Diagnostics**, click **Copy support bundle**, and paste it here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines from around the problem, for example from `docker compose logs immich-edit`. Add the **Reference** from the error message if one was shown.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am on the latest release and searched existing issues.
          required: true
