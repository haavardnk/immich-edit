name: RAW file problem
description: A RAW file won't open or looks wrong.
labels: [raw-format]
body:
  - type: markdown
    attributes:
      value: |
        RAW files are decoded by [rawler](https://github.com/dnglab/dnglab), so cameras it does not support cannot open here either.
  - type: input
    id: camera
    attributes:
      label: Camera
      placeholder: e.g. Sony α7 IV, compressed ARW
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What goes wrong?
      description: An error, wrong colours, a corrupted image, a bad crop. A screenshot next to another app's render helps.
    validations:
      required: true
  - type: input
    id: sample
    attributes:
      label: Sample file
      description: A link to the RAW file (Google Drive, Dropbox, raw.pixls.us). Without one this is very hard to fix.
    validations:
      required: true
  - type: textarea
    id: support_bundle
    attributes:
      label: Support bundle
      description: Copy it from **Settings & diagnostics** > **Diagnostics** > **Copy support bundle**.
