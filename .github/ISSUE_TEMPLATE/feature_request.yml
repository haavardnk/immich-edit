name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Where does immich-edit get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Screenshots or examples from other apps are welcome.
