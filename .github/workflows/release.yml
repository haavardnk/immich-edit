name: Release

on:
  push:
    tags: ['v*']

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      tests: run
      sbom: true
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
