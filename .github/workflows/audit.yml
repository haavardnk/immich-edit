name: Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - 'web/package-lock.json'
      - 'web/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # RUSTSEC-2026-0194/0195 quick-xml, RUSTSEC-2024-0436 paste: transitive via
      # little_exif 0.6.23; upstream main fixed both but has not published 0.6.24
      - name: Audit Rust dependencies
        continue-on-error: true
        uses: actions-rust-lang/audit@v1
        with:
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2024-0436
          createIssues: ${{ github.event_name == 'schedule' }}
      - name: Label audit issues
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --author app/github-actions --search no:label --json number --jq '.[].number' |
            xargs -r -n1 gh issue edit --add-label dependencies

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
