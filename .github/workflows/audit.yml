name: Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - 'web/package-lock.json'
      - 'web/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # RUSTSEC-2026-0194/0195 quick-xml: transitive via little_exif, EXIF-only use
      # RUSTSEC-2024-0436 paste: unmaintained proc-macro via little_exif, no fix available
      # RUSTSEC-2026-0221 event-listener: transitive via sqlx-core, tagged API unused
      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2024-0436,RUSTSEC-2026-0221
          createIssues: ${{ github.event_name == 'schedule' }}

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
